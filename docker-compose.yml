services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Needed for prisma generate during build; overridden by .env at runtime
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/chatapp}
    env_file:
      - "./backend/.env"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4400}
    networks:
      - app
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chatapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Used at build time by Vite; override in .env with your public host
        VITE_API_URL: ${VITE_API_URL:-http://localhost:6600/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:6600}
    env_file:
      - "./frontend/.env"
    ports:
      - "6600:80"
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:

volumes:
  postgres_data:
